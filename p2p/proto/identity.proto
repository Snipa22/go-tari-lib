// Vendored verbatim (field names, numbers and types) from Tari's
// `tari/comms/core/src/proto/identity.proto` (github.com/tari-project/tari, `development`
// branch), as transcribed in P2P_SPEC.md section 6. Package name and message shapes are exact;
// only the go_package option below is specific to this repo's generated-code layout.
syntax = "proto3";

package tari.comms.identity;

option go_package = "github.com/Snipa22/go-tari-lib/p2p/proto";

message PeerIdentityMsg {
    repeated bytes addresses = 1;
    uint32 features = 2;
    repeated bytes supported_protocols = 3;
    string user_agent = 4;
    IdentitySignature identity_signature = 5;
}

message IdentitySignature {
    uint32 version = 1;
    bytes signature = 2;
    bytes public_nonce = 3;
    int64 updated_at = 4;
}
