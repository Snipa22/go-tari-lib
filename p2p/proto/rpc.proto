// Vendored verbatim (field names, numbers and types) from Tari's
// `tari/comms/core/src/proto/rpc.proto` (github.com/tari-project/tari, `development` branch),
// as transcribed in p2p/RPC_TOR_SPEC.md section A2. Package name and message shapes are exact;
// only the go_package option below is specific to this repo's generated-code layout.
syntax = "proto3";

package tari.comms.rpc;

option go_package = "github.com/Snipa22/go-tari-lib/p2p/proto";

message RpcRequest {
    uint32 request_id = 1;
    uint32 method = 2;
    uint32 flags = 3;
    uint64 deadline = 4;
    bytes payload = 10;
}

message RpcResponse {
    uint32 request_id = 1;
    uint32 status = 2;
    uint32 flags = 3;
    bytes payload = 10;
}

message RpcSession {
    repeated uint32 supported_versions = 1;
}

message RpcSessionReply {
    oneof session_result {
        uint32 accepted_version = 1;
        bool rejected = 2;
    }
    enum HandshakeRejectReason {
        HANDSHAKE_REJECT_REASON_UNKNOWN = 0;
        HANDSHAKE_REJECT_REASON_UNSUPPORTED_VERSION = 1;
        HANDSHAKE_REJECT_REASON_NO_SERVER_SESSIONS_AVAILABLE = 2;
        HANDSHAKE_REJECT_REASON_NO_CLIENT_SESSIONS_AVAILABLE = 3;
        HANDSHAKE_REJECT_REASON_PROTOCOL_NOT_SUPPORTED = 4;
    }
    HandshakeRejectReason reject_reason = 3;
}
